# metrics-mux: serves external.metrics.k8s.io and forwards to several adapters.
# Edit the ConfigMap, then apply. The image must be built and pushed by you
# (see README); replace the image reference below.
apiVersion: v1
kind: Namespace
metadata:
  name: metrics-mux
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-mux
  namespace: metrics-mux
---
# Read external metrics from the backends (they authorize this ServiceAccount
# with a SubjectAccessReview) and own the external metrics APIService.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-mux
rules:
- apiGroups: ["external.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  verbs: ["create"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  resourceNames: ["v1beta1.external.metrics.k8s.io"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-mux
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: metrics-mux}
subjects:
- {kind: ServiceAccount, name: metrics-mux, namespace: metrics-mux}
---
# Delegated authentication and authorization, as for every aggregated API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-mux:system:auth-delegator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
- {kind: ServiceAccount, name: metrics-mux, namespace: metrics-mux}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-mux-auth-reader
  namespace: kube-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-apiserver-authentication-reader}
subjects:
- {kind: ServiceAccount, name: metrics-mux, namespace: metrics-mux}
---
# The HPA controller must be allowed to read external metrics (metrics-mux
# checks this with a SubjectAccessReview before forwarding).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-mux-external-metrics-reader
rules:
- apiGroups: ["external.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-mux-hpa-external-metrics
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: metrics-mux-external-metrics-reader}
subjects:
- {kind: ServiceAccount, name: horizontal-pod-autoscaler, namespace: kube-system}
---
# The serving certificate Secret (created on first start).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-mux-certs
  namespace: metrics-mux
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["metrics-mux-serving"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-mux-certs
  namespace: metrics-mux
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: metrics-mux-certs}
subjects:
- {kind: ServiceAccount, name: metrics-mux, namespace: metrics-mux}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-mux-config
  namespace: metrics-mux
data:
  config.yaml: |
    backends:
    - name: keda
      service: {namespace: keda, name: keda-operator-metrics-apiserver, port: 443}
      caSecret: {namespace: keda, name: kedaorg-certs, key: ca.crt}
    - name: prometheus
      service: {namespace: monitoring, name: prometheus-adapter, port: 443}
      insecureSkipTLSVerify: true
    routes:
    - backend: keda
      selectorKeys: [scaledobject.keda.sh/name, scaledjob.keda.sh/name]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-mux
  namespace: metrics-mux
spec:
  selector: {app.kubernetes.io/name: metrics-mux}
  ports:
  - {name: https, port: 443, targetPort: 6443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-mux
  namespace: metrics-mux
  labels: {app.kubernetes.io/name: metrics-mux}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: metrics-mux}
  template:
    metadata:
      labels: {app.kubernetes.io/name: metrics-mux}
    spec:
      serviceAccountName: metrics-mux
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: metrics-mux
        image: metrics-mux:latest
        imagePullPolicy: IfNotPresent
        args:
        - --config=/etc/metrics-mux/config.yaml
        - --cert-secret=metrics-mux/metrics-mux-serving
        - --service-name=metrics-mux
        - --secure-port=6443
        - --v=2
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports:
        - {name: https, containerPort: 6443}
        - {name: status, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /readyz, port: https, scheme: HTTPS}
        livenessProbe:
          httpGet: {path: /healthz, port: status}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: config, mountPath: /etc/metrics-mux}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap: {name: metrics-mux-config}
      - name: tmp
        emptyDir: {}
---
# Read KEDA's CA (kedaorg-certs) to verify its metrics server. Remove if you do not use KEDA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-mux-read-keda-ca
  namespace: keda
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["kedaorg-certs"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-mux-read-keda-ca
  namespace: keda
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: metrics-mux-read-keda-ca}
subjects:
- {kind: ServiceAccount, name: metrics-mux, namespace: metrics-mux}
