apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: e2e
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - {name: pause, image: registry.k8s.io/pause:3.10}
---
# HPA on a metric served by prometheus-adapter (routed by discovery).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: e2e
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: External
    external:
      metric: {name: prom_up}
      target: {type: Value, value: "10"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: e2e
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - {name: pause, image: registry.k8s.io/pause:3.10}
---
# KEDA scaler without external dependencies: counts pods with app=web.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: e2e
spec:
  scaleTargetRef: {name: worker}
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 5
  triggers:
  - type: kubernetes-workload
    metadata:
      podSelector: app=web
      value: "1"
